async function changeMonth(d){S.month=shiftMonth(S.month,d);S.leadF.page=0;try{await loadAudits()}catch(e){toast('Could not load that month')}render()}
async function changePeriod(){S.leadF.page=0;try{await loadAudits()}catch(e){toast('Could not load that period')}render()}
async function act(name,el){
  const id=el.dataset.id, c=+el.dataset.c;
  switch(name){
    case 'retry': loadAll(); break;
    case 'seedStaff': {
      el.disabled=true;
      try{const list=await (await fetch('seed-staff.json',{cache:'no-store'})).json(); let n=0;
        for(const p of list){const id=p.id; const d=Object.assign({},p); delete d.id; if(!await save('staff',id,d))break; n++}
        toast(n+' people added'); await loadAll();
      }catch(e){console.error(e);toast('Could not load the team list');el.disabled=false}
      break}
    case 'pApply': {const f=$('#pFrom').value,t=$('#pTo').value;if(!f||!t){toast('Pick both dates');break}if(f>t){toast('The start date is after the end date');break}S.period={mode:'custom',from:f,to:t};changePeriod();break}
    case 'mkBy': S.mkBy=el.dataset.v; S.mkSort={k:'spend',dir:-1}; render(); break;
    case 'mkSort': {const k=el.dataset.k; S.mkSort=S.mkSort.k===k?{k,dir:-S.mkSort.dir}:{k,dir:k==='k'||k==='cpl'||k==='cpc'?1:-1}; render(); break}
    case 'campSort': {const k=el.dataset.k; S.campSort=S.campSort.k===k?{k,dir:-S.campSort.dir}:{k,dir:k==='name'||k==='cpl'||k==='cpc'?1:-1}; render(); break}
    case 'addCamp': campForm(null); break;
    case 'editCamp': campForm(id); break;
    case 'monthCamp': monthCamp(id); break;
    case 'bulkMonth': bulkMonth(el.dataset.m); break;
    case 'saveBulk': await saveBulk(el.dataset.m); break;
    case 'saveMonthOne': await saveMonthOne(id); break;
    case 'campOff': await campOnOff(id,false); break;
    case 'campOn': await campOnOff(id,true); break;
    case 'toggleCre': el.setAttribute('aria-pressed',String(el.getAttribute('aria-pressed')!=='true')); break;
    case 'addCre': await addCreative(); break;
    case 'saveCamp': await saveCamp(id); break;
    case 'askDelCamp': $('#delZone').innerHTML=`<div class="banner offline"><span class="sp">Delete this campaign? Leads tagged with it become untagged.</span><button class="btn sm danger solid" data-act="doDelCamp" data-id="${id}">Delete campaign</button></div>`; break;
    case 'doDelCamp': {if(Store.mode==='db'){try{await Store.del('campaigns',id)}catch(e){toast('Could not delete');break}} S.campaigns=S.campaigns.filter(c=>c.id!==id); closeModal(); toast('Campaign deleted'); render(); break}
    case 'campImport': campImportModal(); break;
    case 'cimpRead': cimpRead(); break;
    case 'cimpGo': cimpGo(); break;
    case 'exportMk': {
      const {rows}=campStats(); const lines=[['Campaign','Platform','Channel','Treatment','Language','Market','Creatives','Start','Status','Spend in period','Leads','Cost per lead','Confirmed (app)','Cost per confirmation']].concat(rows.map(r=>[r.c.name,r.c.src,r.c.ch||MIXED,r.c.tr||ALL_TR,r.c.lang||ALL_LANG,r.c.region||'',(r.c.creatives||[]).join(' + '),r.c.start,r.c.end?'Off since '+r.c.end:'Running',Math.round(r.spend),Math.round(r.leads),r.leads>=.5?Math.round(r.spend/r.leads):'',r.conf.toFixed(1),r.conf>=.5?Math.round(r.spend/r.conf):'']));
      await offerFile(`milife-marketing-${periodLabel().replace(/[^A-Za-z0-9]+/g,'-')}.csv`,lines.map(r=>r.map(v=>/[",\n]/.test(String(v))?`"${String(v).replace(/"/g,'""')}"`:v).join(',')).join('\n')); break}
    case 'cBy': S.cBy=el.dataset.v; S.cSort={k:'rate',dir:-1}; render(); break;
    case 'cSort': {const k=el.dataset.k; S.cSort=S.cSort.k===k?{k,dir:-S.cSort.dir}:{k,dir:k==='label'?1:-1}; render(); break}
    case 'cDrill': S.cf[el.dataset.d]=el.dataset.v; if(location.hash!=='#closing')location.hash='closing'; else render(); break;
    case 'cCell': S.cf.lang=el.dataset.a; S.cf[S.hmCol]=el.dataset.b; render(); break;
    case 'cRemove': S.cf[el.dataset.d]=''; render(); break;
    case 'cClear': for(const k in S.cf)S.cf[k]=''; render(); break;
    case 'hmCol': S.hmCol=el.dataset.v; render(); break;
    case 'exportClosing': {
      const rows=groupStats(applyCF(leadsOfMonth()),S.cBy).sort((a,b)=>b.n-a.n);
      const fl=Object.entries(S.cf).filter(([,v])=>v).map(([d,v])=>DIMS[d].t+'='+DIMS[d].lab(v)).join('; ');
      const lines=[[DIMS[S.cBy].t,'Leads','Confirmed','Confirmation rate %','Follow-up','Lost']].concat(rows.map(r=>[r.label,r.n,r.c,(r.rate*100).toFixed(1),r.fu,r.lost]));
      await offerFile(`milife-closing-by-${S.cBy}-${S.month}.csv`,(fl?`"Filters: ${fl.replace(/"/g,'""')}"\n`:'')+lines.map(r=>r.map(v=>/[",\n]/.test(String(v))?`"${String(v).replace(/"/g,'""')}"`:v).join(',')).join('\n')); break}
    case 'close': closeModal(); break;
    case 'mPrev': changeMonth(-1); break;
    case 'mNext': changeMonth(1); break;
    case 'person': personModal(id); break;
    case 'boardLang': S.boardLang=el.dataset.v; render(); break;
    case 'stFilter': S.leadF.st=el.dataset.v; S.leadF.page=0; render(); break;
    case 'sort': {const k=el.dataset.k; S.boardSort=S.boardSort.k===k?{k,dir:-S.boardSort.dir}:{k,dir:k==='name'?1:-1}; render(); break}
    case 'exportBoard': {
      const board=boardRows(computeBoard(S.staff,leadsOfMonth(),auditsInRange(),S.settings));
      const lines=[['Rank','Name','Languages','Branch','Leads','Confirmed','Confirmation rate %','WhatsApp review','Score','Grade']].concat(board.map(b=>[b.rank||'',b.p.name,langsOf(b.p).join(' + '),b.p.branch,b.n,b.c,b.n?(b.rate*100).toFixed(1):'',b.audit!=null?Math.round(b.audit):'',b.score!=null?Math.round(b.score):'',b.grade.t]));
      await offerFile(`milife-leaderboard-${S.month}.csv`,lines.map(r=>r.map(v=>/[",\n]/.test(String(v))?`"${String(v).replace(/"/g,'""')}"`:v).join(',')).join('\n')); break}
    case 'import': importModal(); break;
    case 'impRead': impRead(); break;
    case 'impGo': impGo(); break;
    case 'addLead': if(!S.staff.length){toast('Add your sales team first');break} leadForm(); break;
    case 'saveLead': {
      const l={r:uid(),d:$('#fD').value,s:$('#fS').value,src:$('#fSrc').value,ch:$('#fCh').value,lang:$('#fLang').value,st:$('#fSt').value,nm:$('#fNm').value.trim(),ph:$('#fPh').value.trim(),tr:$('#fTr').value};
      if($('#fCamp').value)l.camp=$('#fCamp').value;
      if(!l.d||!l.s){toast('Pick a date and a staff member');break}
      const m=monthOf(l.d);
      let ch=null;
      ch=S.chunks.find(x=>x.kind==='manual'&&x.month===m&&(x.rows||[]).length<250)||null;
      if(!ch)ch={id:`${m}_m${uid()}`,month:m,kind:'manual',rows:[]};
      const doc={month:m,kind:'manual',rows:(ch.rows||[]).concat([l]),at:new Date().toISOString()};
      if(Store.mode==='db'){if(!await save('leads',ch.id,doc))break}
      const ex=S.chunks.find(x=>x.id===ch.id);if(ex)ex.rows=doc.rows;else S.chunks.push(Object.assign({id:ch.id},doc));
      closeModal(); toast('Lead saved'); render(); break}
    case 'delLead': {
      const ch=S.chunks.find(x=>x.id===el.dataset.c); if(!ch)break;
      const rows=(ch.rows||[]).filter(r=>r.r!==el.dataset.r);
      const keep=Object.assign({},ch,{rows,at:new Date().toISOString()}); delete keep.id;
      if(Store.mode==='db'){ if(rows.length){if(!await save('leads',ch.id,keep))break} else {try{await Store.del('leads',ch.id)}catch(e){toast('Could not delete');break}} }
      ch.rows=rows; if(!rows.length){S.chunks=S.chunks.filter(x=>x!==ch)}
      toast('Lead deleted'); render(); break}
    case 'lpage': S.leadF.page+=+el.dataset.d; render(); break;
    case 'addPerson': personForm(null); break;
    case 'editPerson': personForm(id); break;
    case 'toggleLang': {const on=el.getAttribute('aria-pressed')!=='true'; el.setAttribute('aria-pressed',String(on)); break}
    case 'pasteTeam': pasteTeamModal(); break;
    case 'savePaste': {
      const ps=pastedPeople().filter(p=>!p.dup); if(!ps.length){toast('Nothing new to add');break}
      let n=0; for(const p of ps){delete p.dup;p.id=uid();p.createdAt=new Date().toISOString(); if(Store.mode==='db'&&!await save('staff',p.id,p))break; S.staff.push(p); n++}
      S.staff.sort((a,b)=>a.name.localeCompare(b.name)); closeModal(); toast(`Added ${n} people`); render(); break}
    case 'savePerson': {
      const name=$('#pName').value.trim(); if(!name){toast('Enter a name');$('#pName').focus();break}
      const langs=[...document.querySelectorAll('#pLangs button[aria-pressed="true"]')].map(b=>b.dataset.v);
      if(!langs.length){toast('Pick at least one language');break}
      const base=id?staffById(id):{createdAt:new Date().toISOString()};
      const p=Object.assign({},base,{name,code:$('#pCode').value.trim()||name.toUpperCase(),role:$('#pRole').value,branch:$('#pBranch').value.trim()||'—',langs,phone:$('#pPhone').value.trim(),active:$('#pActive').checked});
      delete p.team; p.id=id||uid(); p.notes=p.notes||'';
      if(Store.mode==='db'&&!await save('staff',p.id,p))break;
      if(id)S.staff=S.staff.map(x=>x.id===id?p:x); else S.staff.push(p);
      S.staff.sort((a,b)=>a.name.localeCompare(b.name)); closeModal(); toast(id?'Saved':'Added '+p.name); render(); break}
    case 'askDelete': {
      const p=staffById(id);
      $('#delZone').innerHTML=`<div class="banner offline"><span class="sp">Delete ${esc(p.name)}? Their past leads will show as "Unknown". To keep their history, untick Active instead.</span><button class="btn sm danger solid" data-act="doDelete" data-id="${id}">Delete for good</button></div>`; break}
    case 'doDelete': {
      if(Store.mode==='db'){try{await Store.del('staff',id)}catch(e){toast('Could not delete');break}}
      S.staff=S.staff.filter(p=>p.id!==id); closeModal(); toast('Deleted'); render(); break}
    case 'pick': {
      const active=S.staff.filter(p=>p.active!==false), picked=new Set([...S.cycles.c1,...S.cycles.c2,...S.cycles.c3]);
      const pool=active.filter(p=>!picked.has(p.id)); const n=pickCount(pool.length,c);
      S.cycles['c'+c]=shuffle(pool).slice(0,n).map(p=>p.id);
      await saveCycles(); toast(`Picked ${n} people for cycle ${c}`); render(); break}
    case 'repick': S.cycles['c'+c]=[]; await saveCycles(); render(); break;
    case 'swap': {
      const active=S.staff.filter(p=>p.active!==false), picked=new Set([...S.cycles.c1,...S.cycles.c2,...S.cycles.c3]);
      const pool=active.filter(p=>!picked.has(p.id)); if(!pool.length){toast('No one left to swap in this month');break}
      const nw=shuffle(pool)[0]; S.cycles['c'+c]=S.cycles['c'+c].map(x=>x===id?nw.id:x);
      await saveCycles(); toast(`${staffById(id).name} swapped for ${nw.name}`); render(); break}
    case 'audit': auditForm(id,c); break;
    case 'rate': el.parentElement.querySelectorAll('button').forEach(b=>b.setAttribute('aria-pressed',String(b===el))); updAuditScore(); break;
    case 'saveAudit': {
      const sc=readRates(); if(Object.keys(sc).length<CRITERIA.length){toast('Rate all six points first');break}
      const total=Object.values(sc).reduce((a,b)=>a+b,0);
      const a={month:S.month,cycle:c,staffId:id,scores:sc,pct:total/30*100,chats:+$('#aChats').value||0,evaluator:$('#aEval').value,date:$('#aDate').value,notes:$('#aNotes').value.trim(),at:new Date().toISOString()};
      try{localStorage.setItem('milife-evaluator',a.evaluator)}catch(e){}
      const docId=`${S.month}_${id}`;
      if(Store.mode==='db'&&!await save('audits',docId,a))break;
      S.audits=S.audits.filter(x=>x.staffId!==id).concat([Object.assign({id:docId},a)]);
      S.auditsAll[S.month]=S.audits;
      closeModal(); toast(`Review saved · ${Math.round(a.pct)}/100`); render(); break}
    case 'addPlat': {const list=readPlatforms();list.push({n:'',g:'Paid ads'});$('#platList').innerHTML=list.map((p,i)=>platRow(p,i)).join('');const inp=document.querySelector(`[data-pn="${list.length-1}"]`);inp&&inp.focus();break}
    case 'delPlat': {const list=readPlatforms().filter((_,i)=>i!==+el.dataset.i);$('#platList').innerHTML=list.map((p,i)=>platRow(p,i)).join('');break}
    case 'saveSettings': {
      const s=S.settings; document.querySelectorAll('[data-w]').forEach(i=>s.weights[i.dataset.w]=Math.max(0,+i.value||0));
      const list=v=>v.split(',').map(x=>x.trim()).filter(Boolean);
      s.minLeads=Math.max(1,+$('#sMin').value||1); s.target=Math.max(0,+$('#sTarget').value||0);
      const pl=readPlatforms(); if(pl.length)s.platforms=pl;
      s.currency=$('#sCur').value;
      for(const [k,idq] of [['channels','#sCh'],['languages','#sLang'],['reviewers','#sRev'],['regions','#sReg'],['creatives','#sCre']]){const v=list($(idq).value); if(v.length)s[k]=v}
      s.confirmWords=$('#sConf').value;
      if(Store.mode==='db'&&!await save('config','main',s))break; toast('Settings saved'); render(); break}
    case 'resetSettings': {S.settings=JSON.parse(JSON.stringify(DEFAULT_SETTINGS));render();toast('Defaults restored. Press Save to keep them.');break}
    case 'askClearSample': $('#sampleZone').innerHTML=`<div class="banner offline"><span class="sp">Remove every sample lead and review?</span><button class="btn sm danger solid" data-act="clearSample">Yes, remove</button></div>`; break;
    case 'clearSample': {
      el.disabled=true; el.textContent='Removing…';
      try{
        if(Store.mode==='db'){
          const [ls,as,cs,cps]=await Promise.all([Store.list('leads','sample',true),Store.list('audits','sample',true),Store.list('cycles','sample',true),Store.list('campaigns','sample',true).catch(()=>[])]);
          for(const d of ls)await Store.del('leads',d.id); for(const d of as)await Store.del('audits',d.id); for(const d of cs)await Store.del('cycles',d.id); for(const d of cps)await Store.del('campaigns',d.id);
        }else{ S.chunks=S.chunks.filter(c=>!c.sample); S.campaigns=S.campaigns.filter(c=>!c.sample); for(const m in S.auditsAll)S.auditsAll[m]=S.auditsAll[m].filter(a=>!a.sample); S.memCycles={}; }
        S.auditsAll=Store.mode==='db'?{}:S.auditsAll;
        toast('Sample data removed'); await loadMonth(); render();
      }catch(e){console.error(e);toast('Could not remove all sample data. Try again.')}
      break}
    case 'backup': await offerFile(`milife-sales-backup-${S.month}.json`,JSON.stringify({exportedAt:new Date().toISOString(),month:S.month,staff:S.staff,settings:S.settings,campaigns:S.campaigns,leads:S.chunks,audits:S.audits,cycles:S.cycles},null,2)); break;
  }
}
async function saveCycles(){
  if(Store.mode==='db')await save('cycles',S.month,Object.assign({month:S.month,at:new Date().toISOString()},S.cycles));
  else S.memCycles[S.month]=S.cycles;
}
async function offerFile(filename,data){
  try{const dl=window.claude&&window.claude.use?await window.claude.use('downloads'):null; if(dl){await dl.save({filename,data});return}}catch(e){if(e&&/declin|cancel|reject/i.test(String(e.message||e)))return}
  try{const url=URL.createObjectURL(new Blob([data],{type:/\.csv$/i.test(filename)?'text/csv':'text/plain'}));const a=document.createElement('a');a.href=url;a.download=filename;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),2000);return}catch(e){}
  try{await navigator.clipboard.writeText(data);toast('Downloads aren\'t available here, so the data was copied to your clipboard')}catch(e){toast('Could not download or copy the file here')}
}
async function updateLeadStatus(sel){
  const ch=S.chunks.find(x=>x.id===sel.dataset.c); if(!ch)return;
  const st=sel.value; sel.className='stsel st-'+st;
  const rows=(ch.rows||[]).map(r=>r.r===sel.dataset.r?Object.assign({},r,{st}):r);
  const keep=Object.assign({},ch,{rows,at:new Date().toISOString()}); delete keep.id;
  if(Store.mode==='db'&&!await save('leads',ch.id,keep)){render();return}
  ch.rows=rows; toast(st==='Confirmed'?'Marked as confirmed':'Status updated');
}

/* ================= events ================= */
document.addEventListener('click',e=>{
  const go=e.target.closest('[data-go]'); if(go){e.preventDefault();location.hash=go.dataset.go;return}
  const a=e.target.closest('[data-act]'); if(a&&a.tagName!=='SELECT'){e.preventDefault();act(a.dataset.act,a)}
});
$('#overlay').addEventListener('click',e=>{if(e.target.id==='overlay')closeModal()});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&$('#overlay').classList.contains('open'))closeModal()});
document.addEventListener('submit',e=>e.preventDefault());
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.dataset.act==='leadStatus'){updateLeadStatus(t);return}
  if(t.dataset.cf){S.cf[t.dataset.cf]=t.value;render();return}
  if(t.id==='periodSel'){const v=t.value;if(v==='custom'){const r=curRange();S.period={mode:'custom',from:r.from,to:r.to>todayStr()?todayStr():r.to};render();return}S.period={mode:v};if(v==='month'&&!S.month)S.month=monthOf(todayStr());changePeriod();return}
  if(t.id==='campSrc'){S.campSrc=t.value;render();return}
  const lf={lstaff:'staff',lsrc:'src',lch:'ch',llang:'lang'}; if(lf[t.id]){S.leadF[lf[t.id]]=t.value;S.leadF.page=0;render();return}
  const tf={tlang:'lang',tbranch:'branch',tstatus:'status'}; if(tf[t.id]){S.teamF[tf[t.id]]=t.value;render();return}
  if(t.id==='boardBranch'){S.boardBranch=t.value;render()}
});
let typeT;
document.addEventListener('input',e=>{
  const t=e.target; if(t.id!=='lq'&&t.id!=='tq'&&t.id!=='campQ')return;
  clearTimeout(typeT); typeT=setTimeout(()=>{
    if(t.id==='lq'){S.leadF.q=t.value;S.leadF.page=0}else if(t.id==='campQ')S.campQ=t.value;else S.teamF.q=t.value;
    const pos=t.selectionStart; render(); const n=document.getElementById(t.id); if(n){n.focus();try{n.setSelectionRange(pos,pos)}catch(_){}}
  },250);
});
const VIEWS=['dashboard','closing','marketing','leads','audits','team','setup'];
function route(){const h=location.hash.replace('#','');S.view=VIEWS.includes(h)?h:'dashboard';if(S.loaded)render();else document.querySelectorAll('.mi').forEach(b=>b.setAttribute('aria-current',b.dataset.go===S.view?'page':'false'));window.scrollTo(0,0)}
window.addEventListener('hashchange',route);
route();
(async()=>{
  try{await Auth.start()}catch(e){console.error(e);S.error='Could not connect to Firebase. Check config.js and your internet connection.';render();return}
  loadAll();
})();
</script>
