<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MiLife Sales Performance</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800;900&family=Nunito+Sans:opsz,wght@6..12,400;6..12,600;6..12,700;6..12,800&display=swap" rel="stylesheet">
<style>
/* Layout: white brand sidebar (logo + nav) beside a soft workspace; each view opens with a header, then summary, then detail. */
:root{
  --teal:#0D8D8F; --teal-deep:#08595B; --teal-ink:#0A6F71; --teal-soft:#E4F2F2; --teal-tint:#F1F8F8;
  --gold:#F5BA19; --gold-soft:#FDF3D5; --gold-ink:#8A6200;
  --bg:#F3F6F6; --surface:#FFFFFF; --surface-2:#F7FAFA; --side:#FFFFFF;
  --ink:#122C2C; --ink-2:#2E4A49; --muted:#64797A; --line:#E1E9E9; --line-2:#EDF2F2;
  --good:#1D8A4E; --good-soft:#E3F4EA; --warn:#A87100; --warn-soft:#FBF1D9; --bad:#B9382F; --bad-soft:#F9E5E3;
  --c-ml:#F5BA19; --c-ar:#0D8D8F; --c-en:#5878C4; --c-hi:#D9734E; --c-x1:#8C6BC2; --c-x2:#4FA3C7; --c-x3:#9AA9A8;
  --ch-wa:#1FAA59; --ch-form:#F5BA19; --ch-call:#5878C4; --ch-web:#8C6BC2; --ch-dm:#D9734E; --ch-person:#7C8E8D; --ch-other:#B8C4C3;
  --shadow-sm:0 1px 2px rgba(8,60,60,.05);
  --shadow:0 1px 2px rgba(8,60,60,.04),0 8px 24px -8px rgba(8,60,60,.10);
  --shadow-lg:0 24px 60px -12px rgba(5,40,40,.30);
  --font-display:"Nunito",ui-rounded,"Segoe UI",system-ui,sans-serif;
  --font-body:"Nunito Sans","Segoe UI",system-ui,-apple-system,sans-serif;
  --ease:cubic-bezier(.2,.8,.2,1);
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --teal:#25AFB1; --teal-deep:#0B4A4C; --teal-ink:#6ED3D4; --teal-soft:#123738; --teal-tint:#10292A;
    --gold:#F5BA19; --gold-soft:#3A3013; --gold-ink:#F8D069;
    --bg:#0B1818; --surface:#112323; --surface-2:#152B2B; --side:#0E1E1E;
    --ink:#E6F1F0; --ink-2:#C3D6D5; --muted:#8FA8A7; --line:#203A3A; --line-2:#1A3232;
    --good:#4FC685; --good-soft:#143524; --warn:#E8AE40; --warn-soft:#382C12; --bad:#F07C73; --bad-soft:#3B1B19;
    --c-ar:#25AFB1; --c-en:#7D9BE0; --c-hi:#E99472; --ch-call:#7D9BE0;
    --shadow-sm:none; --shadow:none; --shadow-lg:0 24px 60px -12px rgba(0,0,0,.6); color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --teal:#25AFB1; --teal-deep:#0B4A4C; --teal-ink:#6ED3D4; --teal-soft:#123738; --teal-tint:#10292A;
  --gold:#F5BA19; --gold-soft:#3A3013; --gold-ink:#F8D069;
  --bg:#0B1818; --surface:#112323; --surface-2:#152B2B; --side:#0E1E1E;
  --ink:#E6F1F0; --ink-2:#C3D6D5; --muted:#8FA8A7; --line:#203A3A; --line-2:#1A3232;
  --good:#4FC685; --good-soft:#143524; --warn:#E8AE40; --warn-soft:#382C12; --bad:#F07C73; --bad-soft:#3B1B19;
  --c-ar:#25AFB1; --c-en:#7D9BE0; --c-hi:#E99472; --ch-call:#7D9BE0;
  --shadow-sm:none; --shadow:none; --shadow-lg:0 24px 60px -12px rgba(0,0,0,.6); color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:var(--font-display);margin:0;text-wrap:balance;letter-spacing:-.015em;color:var(--ink)}
h1{font-size:28px;font-weight:900}
h2{font-size:18px;font-weight:800}
h3{font-size:15px;font-weight:800}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
.num{font-variant-numeric:tabular-nums}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px;border-radius:8px}

/* ---------- shell ---------- */
.shell{display:grid;grid-template-columns:252px minmax(0,1fr);min-height:100%}
.side{position:sticky;top:0;height:100vh;background:var(--side);border-right:1px solid var(--line);display:flex;flex-direction:column;padding:26px 18px 18px;gap:26px}
.logo{display:block;padding:4px 8px 22px;border-bottom:1px solid var(--line-2);text-decoration:none}
.logo img{width:100%;max-width:196px;height:auto;display:block}
.logo .lg-dark{display:none}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .logo .lg-light{display:none}:root:not([data-theme="light"]) .logo .lg-dark{display:block}}
:root[data-theme="dark"] .logo .lg-light{display:none}
:root[data-theme="dark"] .logo .lg-dark{display:block}
.logo span{display:block;margin-top:12px;font-family:var(--font-display);font-weight:800;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.logo span i{display:inline-block;width:18px;height:2px;background:var(--gold);vertical-align:middle;margin-right:8px;border-radius:2px}
nav.menu{display:grid;gap:4px}
.mi{display:flex;align-items:center;gap:12px;white-space:nowrap;padding:10px 12px;border-radius:12px;border:0;background:transparent;color:var(--ink-2);font-weight:700;cursor:pointer;text-align:left;transition:background .2s var(--ease),color .2s var(--ease)}
.mi svg{width:19px;height:19px;flex:none;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;opacity:.85}
.mi:hover{background:var(--teal-tint);color:var(--teal-ink)}
.mi[aria-current="page"]{background:var(--teal);color:#fff;box-shadow:0 6px 16px -6px color-mix(in srgb,var(--teal) 70%,transparent)}
.mi[aria-current="page"] svg{opacity:1}
.mi .cnt{margin-left:auto;font-size:12px;background:var(--gold);color:#3b2a00;border-radius:999px;padding:1px 8px;font-weight:800}
.side-foot{margin-top:auto;display:grid;gap:10px;padding:14px;border-radius:14px;background:var(--teal-tint);font-size:13px;color:var(--muted)}
.side-foot b{color:var(--ink)}
.sync{display:flex;align-items:center;gap:8px;font-weight:700}
.sync i{width:8px;height:8px;border-radius:50%;background:var(--good);box-shadow:0 0 0 3px var(--good-soft)}
.sync.off i{background:var(--bad);box-shadow:0 0 0 3px var(--bad-soft)}

.main{min-width:0;padding:28px 36px 48px;display:grid;grid-template-columns:minmax(0,1fr);gap:22px;align-content:start;max-width:1320px;width:100%}
.ph{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap}
.ph p{color:var(--muted);margin-top:4px;max-width:62ch}
.ph-r{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.monthsw{display:flex;align-items:center;gap:2px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:4px;box-shadow:var(--shadow-sm)}
.monthsw button{border:0;background:transparent;width:32px;height:32px;border-radius:50%;cursor:pointer;color:var(--teal-ink);display:grid;place-items:center}
.monthsw button svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.monthsw button:hover{background:var(--teal-soft)}
.monthsw span{font-family:var(--font-display);font-weight:800;min-width:128px;text-align:center}

/* ---------- motion ---------- */
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes pop{from{opacity:0;transform:translateY(14px) scale(.98)}to{opacity:1;transform:none}}
.enter > *{animation:rise .5s var(--ease) both}
.enter > *:nth-child(2){animation-delay:.04s}.enter > *:nth-child(3){animation-delay:.08s}.enter > *:nth-child(4){animation-delay:.12s}.enter > *:nth-child(5){animation-delay:.16s}.enter > *:nth-child(6){animation-delay:.2s}.enter > *:nth-child(n+7){animation-delay:.24s}
.enter .stack{animation:grow .9s var(--ease) both;animation-delay:.15s}
@media (prefers-reduced-motion: reduce){*,*::before,*::after{animation:none!important;transition:none!important}}

/* ---------- hero ---------- */
.hero{position:relative;overflow:hidden;border-radius:22px;padding:26px 30px;color:#fff;background:radial-gradient(120% 140% at 0% 0%,#14A2A4 0%,var(--teal) 38%,#0A6466 100%);box-shadow:0 18px 40px -18px rgba(8,90,92,.55);display:grid;grid-template-columns:minmax(0,1fr) auto;gap:24px;align-items:center}
.hero::after{content:"";position:absolute;right:-60px;top:50%;width:330px;height:330px;transform:translateY(-50%) rotate(8deg);background:url(emblem-white.png) center/contain no-repeat;opacity:.11;pointer-events:none}
.hero .eb{font-size:12px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--gold)}
.hero h1{color:#fff;font-size:30px;margin-top:6px}
.hero p{color:rgba(255,255,255,.82);margin-top:6px}
.hero-stats{display:flex;gap:10px;position:relative;z-index:1;flex-wrap:wrap}
.hs{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.18);backdrop-filter:blur(6px);border-radius:16px;padding:12px 16px;min-width:116px}
.hs b{display:block;font-family:var(--font-display);font-size:26px;font-weight:900;line-height:1.1}
.hs > span{font-size:12px;font-weight:700;color:rgba(255,255,255,.78)}
.hs.gold{background:var(--gold);border-color:var(--gold);color:#3b2a00}
.hs.gold > span{color:#5c4300}

/* ---------- cards ---------- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);padding:20px 22px}
.card-h{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:16px;flex-wrap:wrap}
.card-h p{margin-top:3px;color:var(--muted);font-size:13.5px}
.grid{display:grid;gap:18px}
.g-tiles{grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}
.g-2{grid-template-columns:repeat(auto-fit,minmax(360px,1fr))}
.g-3{grid-template-columns:repeat(auto-fit,minmax(270px,1fr))}
.g-4{grid-template-columns:repeat(auto-fit,minmax(230px,1fr))}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px 18px;box-shadow:var(--shadow);display:grid;gap:2px;transition:transform .25s var(--ease),box-shadow .25s var(--ease)}
.tile:hover{transform:translateY(-2px)}
.tile .lbl{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:700;color:var(--muted)}
.tile .lbl i{width:8px;height:8px;border-radius:50%;background:var(--teal)}
.tile .val{font-family:var(--font-display);font-weight:900;font-size:30px;line-height:1.15;margin-top:4px}
.tile .sub{font-size:13px;color:var(--muted)}

/* bars */
.bars{display:grid;gap:12px}
.brow{display:grid;grid-template-columns:minmax(100px,150px) minmax(0,1fr) 78px;gap:12px;align-items:center;font-size:14px}
.brow .bn{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600;color:var(--ink-2)}
.track{height:10px;background:var(--line-2);border-radius:999px;overflow:hidden}
.stack{display:flex;height:100%;transform-origin:left center}
.stack > i{display:block;height:100%}
.stack > i + i{box-shadow:inset 1.5px 0 0 var(--surface)}
.brow .bv{text-align:right;font-variant-numeric:tabular-nums;font-weight:800}
.brow .bv small{color:var(--muted);font-weight:600;margin-left:3px}
.legend{display:flex;gap:6px 14px;font-size:13px;color:var(--muted);flex-wrap:wrap}
.legend span{display:inline-flex;align-items:center;gap:6px}
.dot{display:inline-block;width:9px;height:9px;border-radius:3px}
.groups{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.grp{flex:1;min-width:110px;background:var(--surface-2);border:1px solid var(--line-2);border-radius:12px;padding:8px 12px}
.grp b{display:block;font-family:var(--font-display);font-size:20px}
.grp span{font-size:12px;color:var(--muted);font-weight:700}

/* highlight */
.hl{display:flex;gap:14px;align-items:center;padding:16px;border-radius:18px;border:1px solid var(--line);background:var(--surface);box-shadow:var(--shadow);transition:transform .25s var(--ease)}
.hl:hover{transform:translateY(-2px)}
.hl .k{font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.hl .who{font-family:var(--font-display);font-weight:800;font-size:17px;display:block;margin:1px 0}
.hl .why{font-size:13px;color:var(--muted)}
.hl.star{background:linear-gradient(140deg,var(--gold-soft),var(--surface) 75%);border-color:color-mix(in srgb,var(--gold) 45%,var(--line))}
.hl > div{min-width:0}

/* avatar */
.av{width:36px;height:36px;border-radius:50%;display:inline-grid;place-items:center;font-family:var(--font-display);font-weight:900;font-size:13px;flex:none;color:var(--teal-deep);background:var(--teal-soft)}
.av.lg{width:46px;height:46px;font-size:16px}
.av.t1{background:#FDF0CC;color:#7A5600}.av.t2{background:#E1EEF9;color:#2E5590}.av.t3{background:#F7E4DC;color:#9A4325}.av.t4{background:#ECE5F7;color:#5B3E91}
:root[data-theme="dark"] .av{filter:saturate(.8) brightness(.9)}
.who-cell{display:flex;align-items:center;gap:10px;min-width:0}
.namebtn{font-weight:800;cursor:pointer;color:var(--ink);background:none;border:0;padding:0;text-align:left;font-size:14.5px}
.namebtn:hover{color:var(--teal-ink)}
.who-cell small{display:block;color:var(--muted);font-size:12.5px}

/* tables */
.tbl-wrap{overflow-x:auto;border-radius:14px;border:1px solid var(--line-2)}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{padding:11px 14px;text-align:left;border-bottom:1px solid var(--line-2);white-space:nowrap}
th{font-size:12px;letter-spacing:.04em;color:var(--muted);background:var(--surface-2);font-weight:800;text-transform:uppercase}
th.sortable{cursor:pointer;user-select:none}
th.sortable:hover{color:var(--teal-ink)}
td.r,th.r{text-align:right}
tbody tr{transition:background .15s}
tbody tr:hover{background:var(--teal-tint)}
tbody tr:last-child td{border-bottom:0}
.rank{display:inline-grid;place-items:center;width:28px;height:28px;border-radius:9px;font-weight:900;font-size:13px;color:var(--muted);font-family:var(--font-display)}
.rank.r1{background:var(--gold);color:#3b2a00}
.rank.r2,.rank.r3{background:var(--teal-soft);color:var(--teal-ink)}
.scorebar{display:flex;align-items:center;gap:10px;justify-content:flex-end}
.scorebar .track{width:74px;height:7px}
.scorebar b{font-family:var(--font-display);font-size:16px;min-width:26px;text-align:right}

.chip{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:999px;font-size:12px;font-weight:800;white-space:nowrap;line-height:1.4}
.chip.good{background:var(--good-soft);color:var(--good)}
.chip.warn{background:var(--warn-soft);color:var(--warn)}
.chip.bad{background:var(--bad-soft);color:var(--bad)}
.chip.mute{background:var(--surface-2);color:var(--muted);border:1px solid var(--line)}
.chip.star{background:var(--gold);color:#3b2a00}
.chip.teal{background:var(--teal-soft);color:var(--teal-ink)}
.langs{display:inline-flex;gap:4px;flex-wrap:wrap}
.lg{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:800;padding:2px 9px 2px 7px;border-radius:999px;background:var(--surface-2);border:1px solid var(--line);color:var(--ink-2)}
.lg i{width:7px;height:7px;border-radius:50%}
.st{display:inline-flex;align-items:center;gap:6px;font-weight:800;font-size:12.5px;padding:3px 10px;border-radius:999px}
.st i{width:7px;height:7px;border-radius:50%;background:currentColor}
.st-New{background:var(--surface-2);color:var(--muted);border:1px solid var(--line)}
.st-Contacted{background:#E6EEFA;color:#3A5DA8}
.st-Follow-up{background:var(--warn-soft);color:var(--warn)}
.st-Confirmed{background:var(--good-soft);color:var(--good)}
.st-Lost{background:var(--bad-soft);color:var(--bad)}
:root[data-theme="dark"] .st-Contacted{background:#1B2A45;color:#9DB6EC}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .st-Contacted{background:#1B2A45;color:#9DB6EC}}
select.stsel{appearance:none;-webkit-appearance:none;border:0;border-radius:999px;padding:4px 26px 4px 12px;font-weight:800;font-size:12.5px;cursor:pointer;background-image:linear-gradient(45deg,transparent 50%,currentColor 50%),linear-gradient(135deg,currentColor 50%,transparent 50%);background-position:calc(100% - 13px) 52%,calc(100% - 9px) 52%;background-size:4px 4px;background-repeat:no-repeat}

/* controls */
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.toolbar .grow{flex:1;min-width:200px}
.btn{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface);padding:9px 16px;border-radius:12px;font-weight:800;cursor:pointer;white-space:nowrap;transition:transform .15s var(--ease),background .2s,border-color .2s,box-shadow .2s;box-shadow:var(--shadow-sm)}
.btn svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.btn:hover{border-color:var(--teal);color:var(--teal-ink)}
.btn:active{transform:scale(.97)}
.btn.primary{background:var(--teal);border-color:var(--teal);color:#fff;box-shadow:0 8px 18px -8px color-mix(in srgb,var(--teal) 80%,transparent)}
.btn.primary:hover{background:var(--teal-ink);border-color:var(--teal-ink);color:#fff}
.btn.gold{background:var(--gold);border-color:var(--gold);color:#3b2a00}
.btn.gold:hover{color:#3b2a00;filter:brightness(1.04)}
.btn.ghost-w{background:rgba(255,255,255,.14);border-color:rgba(255,255,255,.3);color:#fff;box-shadow:none}
.btn.ghost-w:hover{background:rgba(255,255,255,.24);color:#fff;border-color:rgba(255,255,255,.5)}
.btn.danger{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 35%,var(--line))}
.btn.danger.solid{background:var(--bad);color:#fff;border-color:var(--bad)}
.btn.sm{padding:6px 12px;font-size:13px;border-radius:10px}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none}
.iconbtn{border:0;background:none;cursor:pointer;color:var(--muted);width:30px;height:30px;border-radius:8px;display:inline-grid;place-items:center}
.iconbtn svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round}
.iconbtn:hover{background:var(--surface-2);color:var(--ink)}
input[type=text],input[type=search],input[type=number],input[type=date],input[type=tel],select,textarea{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:9px 12px;min-width:0;transition:border-color .2s,box-shadow .2s}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--teal);box-shadow:0 0 0 4px color-mix(in srgb,var(--teal) 16%,transparent)}
textarea{width:100%;min-height:150px;resize:vertical;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:13px}
label.f{display:grid;gap:6px;align-content:start;font-size:13px;font-weight:800;color:var(--ink-2)}
label.f > input,label.f > select,label.f > textarea{font-weight:400;font-size:15px;color:var(--ink)}
label.f .hint{font-weight:500;color:var(--muted);font-size:12.5px}
.form{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(210px,1fr))}
.form .full{grid-column:1/-1}
.seg{display:inline-flex;background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{border:0;background:transparent;padding:6px 12px;cursor:pointer;font-weight:800;font-size:13px;color:var(--muted);border-radius:9px;transition:background .2s,color .2s}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--teal-ink);box-shadow:var(--shadow-sm),0 0 0 1px var(--line)}
.pick{display:flex;gap:8px;flex-wrap:wrap}
.pick button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 14px;font-weight:800;font-size:13.5px;cursor:pointer;display:inline-flex;gap:7px;align-items:center;transition:all .2s var(--ease)}
.pick button i{width:8px;height:8px;border-radius:50%}
.pick button[aria-pressed="true"]{border-color:var(--teal);background:var(--teal-soft);color:var(--teal-ink)}
.pick button[aria-pressed="true"]::after{content:"✓";font-weight:900}

/* banner */
.banner{display:flex;gap:12px;align-items:center;flex-wrap:wrap;padding:12px 16px;border-radius:14px;font-weight:600;font-size:14px}
.banner.sample{background:var(--gold-soft);color:var(--gold-ink);border:1px solid color-mix(in srgb,var(--gold) 40%,transparent)}
.banner.offline{background:var(--bad-soft);color:var(--bad)}
.banner.seed{background:var(--teal-soft);color:var(--teal-ink)}
.banner .sp{flex:1;min-width:220px}

/* audits */
.cycle{display:grid;gap:14px;align-content:start;position:relative}
.cycle .meta{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.cycle .when{font-size:13px;color:var(--muted);font-weight:700}
.cycle.now{border-color:color-mix(in srgb,var(--teal) 55%,var(--line));box-shadow:0 0 0 3px var(--teal-soft),var(--shadow)}
.cycle.now::before{content:"Current";position:absolute;top:-10px;left:20px;background:var(--teal);color:#fff;font-size:11px;font-weight:900;letter-spacing:.08em;text-transform:uppercase;padding:2px 10px;border-radius:999px}
.plist{display:grid;gap:6px}
.prow{display:flex;align-items:center;gap:10px;justify-content:space-between;padding:8px 10px;border:1px solid var(--line-2);border-radius:12px;background:var(--surface-2);font-size:14px;transition:border-color .2s}
.prow:hover{border-color:var(--line)}
.prow .pn{display:flex;align-items:center;gap:10px;min-width:0;font-weight:800}
.prow .pn span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.prow .pa{display:flex;gap:6px;align-items:center;flex-shrink:0}
.ring{--p:0;width:54px;height:54px;border-radius:50%;background:conic-gradient(var(--good) calc(var(--p)*1%),var(--line-2) 0);display:grid;place-items:center;flex:none}
.ring b{width:42px;height:42px;border-radius:50%;background:var(--surface);display:grid;place-items:center;font-family:var(--font-display);font-size:13px}
.crit{display:grid;gap:8px}
.critrow{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center;padding:11px 14px;border:1px solid var(--line-2);border-radius:14px;background:var(--surface-2)}
.critrow b{display:block;font-size:14.5px}
.critrow span{font-size:13px;color:var(--muted)}
.rate{display:inline-flex;gap:4px}
.rate button{width:36px;height:36px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-weight:900;cursor:pointer;font-family:var(--font-display);transition:all .15s var(--ease)}
.rate button:hover{border-color:var(--teal)}
.rate button[aria-pressed="true"]{background:var(--teal);color:#fff;border-color:var(--teal);transform:scale(1.06)}
.bigscore{font-family:var(--font-display);font-weight:900;font-size:40px;line-height:1;color:var(--teal-ink)}

/* modal */
.overlay{position:fixed;inset:0;background:rgba(4,26,26,.42);backdrop-filter:blur(3px);display:none;align-items:flex-start;justify-content:center;padding:44px 16px;z-index:50;overflow-y:auto}
.overlay.open{display:flex}
.modal{background:var(--surface);border-radius:22px;border:1px solid var(--line);width:min(780px,100%);padding:24px 26px;display:grid;gap:18px;box-shadow:var(--shadow-lg);animation:pop .3s var(--ease) both}
.modal-h{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.modal-h p{margin-top:4px;color:var(--muted);font-size:14px}
.modal-f{display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap;align-items:center}
.toast{position:fixed;bottom:24px;left:50%;transform:translate(-50%,20px);background:var(--ink);color:var(--bg);padding:11px 18px;border-radius:12px;font-weight:800;z-index:60;opacity:0;pointer-events:none;transition:opacity .25s var(--ease),transform .25s var(--ease);box-shadow:var(--shadow-lg)}
.toast.show{opacity:1;transform:translate(-50%,0)}
.empty{padding:36px 20px;text-align:center;color:var(--muted);display:grid;gap:8px;justify-items:center}
.empty img{width:56px;opacity:.5;margin-bottom:4px}
.note{font-size:13px;color:var(--muted)}
.muted{color:var(--muted)}
.kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(118px,1fr));gap:10px}
.kv div{background:var(--surface-2);border:1px solid var(--line-2);border-radius:14px;padding:10px 12px}
.kv b{display:block;font-family:var(--font-display);font-size:22px;font-weight:900}
.kv span{font-size:12px;color:var(--muted);font-weight:800}
.loading{padding:80px 20px;text-align:center;color:var(--muted);font-weight:700;display:grid;justify-items:center;gap:14px}
.loading img{width:64px;animation:spin 2.4s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.plat-row{display:grid;grid-template-columns:1fr 170px 34px;gap:8px;align-items:center}

.period{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.period > select{border-radius:999px;padding:8px 14px;font-weight:800;background:var(--surface);box-shadow:var(--shadow-sm)}
.period .plabel{font-size:13px;font-weight:700;color:var(--muted);background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:8px 14px}
.period .range{display:flex;align-items:center;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:4px 4px 4px 10px}
.period .range input{border:0;padding:5px 4px;background:transparent}
.period .range span{font-size:13px;color:var(--muted);font-weight:700}
.campname{font-weight:800;white-space:normal;min-width:200px;display:block}
.fbar{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.fbar label.f{font-size:12px}
.fbar select{font-size:14px;padding:7px 10px}
.fchips{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.fchip{display:inline-flex;align-items:center;gap:6px;background:var(--teal-soft);color:var(--teal-ink);border:0;border-radius:999px;padding:4px 6px 4px 12px;font-weight:800;font-size:12.5px;cursor:pointer}
.fchip span{display:inline-grid;place-items:center;width:18px;height:18px;border-radius:50%;background:rgba(0,0,0,.08);font-size:11px}
.drill{cursor:pointer}
.drill:hover td:first-child{color:var(--teal-ink)}
.ratebar{display:flex;align-items:center;gap:10px;min-width:170px}
.ratebar .track{flex:1;height:8px}
.ratebar b{min-width:48px;text-align:right;font-family:var(--font-display)}
.delta{font-size:12px;font-weight:800;padding:2px 8px;border-radius:999px}
.delta.up{background:var(--good-soft);color:var(--good)}.delta.down{background:var(--bad-soft);color:var(--bad)}.delta.flat{background:var(--surface-2);color:var(--muted)}
.hm{border-collapse:separate;border-spacing:4px;width:auto;min-width:100%}
.hm th,.hm td{border:0;padding:0;background:none;text-transform:none;letter-spacing:0}
.hm thead th{font-size:12px;color:var(--muted);font-weight:800;padding:4px 6px;text-align:center;white-space:normal;max-width:90px}
.hm tbody th{font-size:13px;font-weight:800;color:var(--ink-2);text-align:left;padding-right:8px;white-space:nowrap}
.hm .cell{border-radius:10px;padding:8px 6px;text-align:center;min-width:72px;cursor:pointer;transition:transform .15s var(--ease)}
.hm .cell:hover{transform:scale(1.04)}
.hm .cell b{display:block;font-family:var(--font-display);font-size:15px}
.hm .cell small{font-size:11px;opacity:.8}
.hm .cell.none{background:var(--surface-2);color:var(--muted);cursor:default}
.hm .cell.few{opacity:.55}
@media (max-width:900px){
  .shell{grid-template-columns:1fr}
  .side{position:sticky;top:0;z-index:30;height:auto;flex-direction:row;align-items:center;padding:10px 14px;gap:12px;border-right:0;border-bottom:1px solid var(--line);flex-wrap:wrap}
  .logo{padding:0;border:0}
  .logo img{max-width:130px}
  .logo span,.side-foot{display:none}
  nav.menu{display:flex;overflow-x:auto;width:100%;gap:4px}
  .mi{padding:8px 12px;white-space:nowrap}
  .main{padding:18px 16px 40px}
  .hero{grid-template-columns:1fr;padding:22px}
  .g-2{grid-template-columns:1fr}
}
@media (max-width:520px){ .brow{grid-template-columns:92px minmax(0,1fr) 64px} h1{font-size:24px} .hero h1{font-size:24px} }
/* sign-in screen (standalone hosting) */
.login{position:fixed;inset:0;z-index:200;display:flex;align-items:center;justify-content:center;padding:20px;background:var(--bg)}
.login form{width:100%;max-width:400px;display:grid;gap:14px;background:var(--surface);border:1px solid var(--line);border-radius:22px;box-shadow:var(--shadow-lg);padding:30px 28px}
.login img{height:52px;width:auto;justify-self:center}
.login h1{margin:4px 0 0;text-align:center;font-family:var(--font-display);font-size:24px;color:var(--ink)}
.login p{margin:0;text-align:center;color:var(--muted);font-size:14px}
.login label{display:grid;gap:6px;font-size:13px;font-weight:700;color:var(--ink-2)}
.login input{font:inherit;font-size:15px;padding:11px 13px;border:1px solid var(--line);border-radius:12px;background:var(--surface);color:var(--ink)}
.login input:focus{outline:2px solid var(--teal);outline-offset:1px;border-color:var(--teal)}
.login .err{color:var(--bad);font-size:13px;font-weight:700;text-align:center;min-height:18px}
.login .btn{justify-content:center}
.login .link{background:none;border:0;color:var(--teal-ink);font:inherit;font-size:13px;font-weight:700;cursor:pointer;justify-self:center}
.who{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:12px;word-break:break-all}
.who button{background:none;border:0;color:var(--teal-ink);font:inherit;font-weight:800;cursor:pointer;padding:0;white-space:nowrap}

<script>
"use strict";
/* ================= constants ================= */
const STATUSES=['New','Contacted','Follow-up','Confirmed','Lost'];
const TREATMENTS=['Pediatric rehab','Spine care','Pain management','Physiotherapy','Neuro rehab','Other'];
const ROLES=['Doctor','GRE','FOM','Sales','Other'];
const GROUPS=['Paid ads','Website','Referral','Management','Walk-in','Other'];
const CRITERIA=[
  {k:'speed',t:'First reply speed',d:'New enquiries answered quickly, within working hours'},
  {k:'missed',t:'No unanswered chats',d:'No leads left on "seen" or without a reply'},
  {k:'follow',t:'Follow-up discipline',d:'Regular follow-ups until the lead decides'},
  {k:'tone',t:'Tone and language',d:'Polite, warm, correct in the patient\'s language'},
  {k:'knowledge',t:'Treatment and package knowledge',d:'Accurate details on therapy, stay, meals, cost'},
  {k:'closing',t:'Confirmation effort',d:'Asks for reports, books consults, gets the confirmation'}
];
const DEFAULT_SETTINGS={
  weights:{audit:40,confirmations:25,closing:25,volume:10},
  minLeads:5, target:0,
  languages:['Malayalam','Arabic','English','Hindi'],
  platforms:[
    {n:'Meta Ads',g:'Paid ads'},{n:'Snapchat Ads',g:'Paid ads'},{n:'Google Ads',g:'Paid ads'},{n:'TikTok Ads',g:'Paid ads'},
    {n:'LinkedIn Ads',g:'Paid ads'},{n:'X Ads',g:'Paid ads'},{n:'Website',g:'Website'},{n:'Referral',g:'Referral'},
    {n:'Iqbal Sir (MD)',g:'Management'},{n:'Dr Shabeer',g:'Management'},{n:'Walk-in',g:'Walk-in'},{n:'Other',g:'Other'}
  ],
  channels:['WhatsApp','Lead form','Phone call','Website form','DM','In person'],
  reviewers:['Gokul Sir'],
  currency:'₹',
  regions:['GCC (all)','Saudi Arabia','UAE','Qatar','Kuwait','Oman','India','Kerala','Other'],
  creatives:['Video','Doctor video','Testimonial video','Image','Carousel','Search ad','Other'],
  confirmWords:'confirmed, confirm, booked, admitted, admission, converted, coming'
};
const OFFLINE_ROSTER=`JABIR IBNU MEDICITY(AR)
JIMSHAD MEDICARE(AR)
PRASHAND MEDICITY (AR)
RAHEESA GRE MEDICITY
YASER GRE MEDICITY
SHABNA ZAHRA
ANEES PUTHUR(AR)
DR ANAGHA MEDICARE
DR FARSANA MEDICITY(AR)
DR FATHIMA MEDICITY (AR)
DR MAHI GOPAN MEDICITY
DR NASEEBA KOTTAKAL (AR)
DR SUNEEB MEDICITY(AR)
SHAMEEM GRE MEDICITY(AR)
VIBIN FOM KOTTAKAL`;
const IC={
  plus:'<svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>',
  up:'<svg viewBox="0 0 24 24"><path d="M12 16V4M7 9l5-5 5 5"/><path d="M4 16v3a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-3"/></svg>',
  down:'<svg viewBox="0 0 24 24"><path d="M12 4v12M7 11l5 5 5-5"/><path d="M4 16v3a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-3"/></svg>',
  shuffle:'<svg viewBox="0 0 24 24"><path d="M16 3h5v5M4 20 21 3M21 16v5h-5M15 15l6 6M4 4l5 5"/></svg>',
  x:'<svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg>',
  left:'<svg viewBox="0 0 24 24"><path d="M15 6l-6 6 6 6"/></svg>',
  right:'<svg viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg>',
  trash:'<svg viewBox="0 0 24 24"><path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"/></svg>'
};

/* ================= helpers ================= */
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad=n=>String(n).padStart(2,'0');
const uid=()=>{const a=new Uint32Array(2);crypto.getRandomValues(a);return a[0].toString(36)+a[1].toString(36).slice(0,4)};
const normTxt=s=>String(s||'').toLowerCase().replace(/[^a-z0-9]+/g,' ').trim();
const MONTHS=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const MONTHS_L=['January','February','March','April','May','June','July','August','September','October','November','December'];
function todayStr(){const d=new Date();return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`}
function monthOf(dateStr){return String(dateStr).slice(0,7)}
function monthLabel(m){const [y,mo]=m.split('-').map(Number);return `${MONTHS_L[mo-1]} ${y}`}
function shiftMonth(m,delta){let [y,mo]=m.split('-').map(Number);mo+=delta;while(mo>12){mo-=12;y++}while(mo<1){mo+=12;y--}return `${y}-${pad(mo)}`}
function daysIn(m){const [y,mo]=m.split('-').map(Number);return new Date(y,mo,0).getDate()}
function cycleOfDay(day){return day<=10?1:day<=20?2:3}
function cycleRange(m,c){const mo=MONTHS[+m.slice(5)-1];return c===1?`1–10 ${mo}`:c===2?`11–20 ${mo}`:`21–${daysIn(m)} ${mo}`}
function currentCycle(m){const t=todayStr();if(monthOf(t)===m)return cycleOfDay(+t.slice(8));return m<monthOf(t)?4:0}
function pct(a,b){return b?a/b*100:0}
function fmtPct(v,d=0){return (Math.round(v*Math.pow(10,d))/Math.pow(10,d)).toFixed(d)+'%'}
function ymd(y,m,d){if(!(y>1990&&m>=1&&m<=12&&d>=1&&d<=31))return null;return `${y}-${pad(m)}-${pad(d)}`}
function titleCase(s){return s.toLowerCase().replace(/(^|[\s(])([a-z])/g,(a,b,c)=>b+c.toUpperCase())}
function fmtDate(d){if(!d)return '';const [y,m,dd]=String(d).split('-');return `${+dd} ${MONTHS[+m-1]}`}
function hashN(s,n){let h=0;for(const c of String(s))h=(h*31+c.charCodeAt(0))>>>0;return h%n}
function initials(name){const w=String(name).replace(/^Dr\.?\s+/i,'').replace(/\(.*?\)/g,'').trim().split(/\s+/);return ((w[0]||'')[0]||'')+((w[1]||'')[0]||'')}
function avatar(p,lg){return `<span class="av ${lg?'lg':''} t${hashN(p.id||p.name,5)}" aria-hidden="true">${esc(initials(p.name).toUpperCase())}</span>`}
function langsOf(p){return Array.isArray(p.langs)&&p.langs.length?p.langs:[p.team||'Malayalam']}
const LANG_VARS={Malayalam:'var(--c-ml)',Arabic:'var(--c-ar)',English:'var(--c-en)',Hindi:'var(--c-hi)'};
function langColor(l){if(LANG_VARS[l])return LANG_VARS[l];const i=Math.max(0,S.settings.languages.indexOf(l));return ['var(--c-x1)','var(--c-x2)','var(--c-x3)'][i%3]}
const CH_VARS={'WhatsApp':'var(--ch-wa)','Lead form':'var(--ch-form)','Phone call':'var(--ch-call)','Website form':'var(--ch-web)','DM':'var(--ch-dm)','In person':'var(--ch-person)'};
function chColor(c){return CH_VARS[c]||'var(--ch-other)'}
function langChips(p){return `<span class="langs">${langsOf(p).map(l=>`<span class="lg"><i style="background:${langColor(l)}"></i>${esc(l)}</span>`).join('')}</span>`}
function groupOf(platform){const p=S.settings.platforms.find(x=>x.n===platform);return p?p.g:'Other'}

/* Parse a dropdown label like "DR NASEEBA KOTTAKAL (AR)" into a person. */
function parseLabel(raw){
  const code=String(raw||'').trim().replace(/\s+/g,' ');
  if(!code)return null;
  let s=code, langs=['Malayalam'], role='Sales', notes=[];
  if(/\(\s*AR\b[^)]*\)?/i.test(s)){langs=['Arabic'];s=s.replace(/\(\s*AR\b[^)]*\)?/ig,' ')}
  if(/^dr\.?\s+/i.test(s)){role='Doctor';s=s.replace(/^dr\.?\s+/i,'')}
  const branchMap=[[/^medici(ty|t)?$/i,'Medicity'],[/^medicar(e)?$/i,'Medicare'],[/^puth(u|oo)r$/i,'Puthur'],[/^kottaka(l|la)?$/i,'Kottakal'],[/^zahra$/i,'Zahra']];
  const branches=[]; const nameT=[];
  for(const tok of s.split(/\s+/)){
    if(!tok)continue;
    if(/^(gre|fom|ehk)$/i.test(tok)){ if(role==='Sales')role=tok.toUpperCase()==='EHK'?'Other':tok.toUpperCase(); continue }
    if(/^milife$/i.test(tok))continue;
    if(/^naturop/i.test(tok)){notes.push('Naturopathy');continue}
    const b=branchMap.find(([re])=>re.test(tok));
    if(b){ if(!branches.includes(b[1]))branches.push(b[1]); continue }
    if(branches.length && /^[a-z]$/i.test(tok))continue;
    nameT.push(tok);
  }
  let name=titleCase(nameT.join(' ')||code).replace(/(\S)\(/g,'$1 (');
  if(role==='Doctor')name='Dr '+name;
  return {name,code,role,branch:branches.join(' ')||'—',langs,phone:'',notes:notes.join(', '),active:true};
}
function parseDate(raw,dayFirst=true){
  if(raw==null)return null; const s=String(raw).trim(); if(!s)return null; let m;
  if((m=s.match(/^(\d{4})[-\/.](\d{1,2})[-\/.](\d{1,2})/)))return ymd(+m[1],+m[2],+m[3]);
  if((m=s.match(/^(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{2,4})/))){
    let a=+m[1],b=+m[2],y=+m[3]; if(y<100)y+=2000;
    let d=dayFirst?a:b, mo=dayFirst?b:a;
    if(mo>12&&d<=12){const t=d;d=mo;mo=t}
    return ymd(y,mo,d);
  }
  if(/^\d{5}(\.\d+)?$/.test(s)){const dt=new Date(Date.UTC(1899,11,30)+parseFloat(s)*86400000);return ymd(dt.getUTCFullYear(),dt.getUTCMonth()+1,dt.getUTCDate())}
  const t=Date.parse(s); if(!isNaN(t)){const dt=new Date(t);return ymd(dt.getFullYear(),dt.getMonth()+1,dt.getDate())}
  return null;
}
function normPlatform(raw,platforms){
  const s=String(raw||'').toLowerCase().trim(); const names=platforms.map(p=>p.n);
  const other=names.includes('Other')?'Other':names[names.length-1];
  if(!s)return other;
  const exact=names.find(x=>x.toLowerCase()===s); if(exact)return exact;
  const rules=[[/iqbal/,'iqbal'],[/shab(ee|i)r/,'shabeer'],[/snap/,'snap'],[/tik ?tok/,'tiktok'],[/linked ?in/,'linkedin'],[/twitter|^x\b|\bx ads/,'x ads'],[/google|g ?ads|adwords|youtube|search/,'google'],[/meta|facebook|^fb\b|insta|^ig\b|whats|ctwa/,'meta'],[/web|site|landing|seo|organic/,'website'],[/refer/,'referral'],[/walk/,'walk']];
  for(const [re,key] of rules){ if(re.test(s)){ const hit=names.find(x=>x.toLowerCase().includes(key)); if(hit)return hit } }
  return other;
}
function normChannel(raw,channels,fallback){
  const s=String(raw||'').toLowerCase().trim();
  const find=k=>channels.find(x=>x.toLowerCase().includes(k));
  if(s){
    const exact=channels.find(x=>x.toLowerCase()===s); if(exact)return exact;
    if(/whats|^wa\b|ctwa|click.?to/.test(s))return find('whatsapp')||channels[0];
    if(/web.*form|site.*form/.test(s))return find('website')||channels[0];
    if(/form|lead ?gen|instant/.test(s))return find('lead form')||channels[0];
    if(/call|phone|tele/.test(s))return find('phone')||channels[0];
    if(/\bdm\b|message|inbox|messenger/.test(s))return find('dm')||channels[0];
    if(/walk|person|visit/.test(s))return find('person')||channels[0];

function normLang(raw,languages){const s=String(raw||'').toLowerCase().trim(); if(!s)return null;
  if(/^ar$|arab|عرب/.test(s))return 'Arabic'; if(/^ml$|^mal|malay|മല/.test(s))return 'Malayalam'; if(/^en$|eng/.test(s))return 'English'; if(/^hi$|hindi/.test(s))return 'Hindi';
  return languages.find(l=>l.toLowerCase()===s)||null}
function normStatus(raw,words){
  const s=String(raw||'').toLowerCase().trim(); if(!s)return 'New';
  const exact=STATUSES.find(x=>x.toLowerCase()===s); if(exact)return exact;
  if(s==='converted')return 'Confirmed';
  const negated=/\b(not|no|non|un|never)\b/.test(s);
  if(words.some(w=>w&&s.includes(w)))return negated?'Lost':'Confirmed';
  if(/lost|interest|junk|invalid|wrong|spam|cancel|no response|dead|reject|declin/.test(s))return negated||/lost|junk|invalid|wrong|spam|cancel|dead|reject|declin|no response/.test(s)?'Lost':'Contacted';
  if(/follow|pending|thinking|later|call ?back|waiting|discussion/.test(s))return 'Follow-up';
  if(/contact|called|replied|talk|spoke|responded/.test(s))return 'Contacted';
  return 'New';
}
function matchStaff(raw,staff){

    ||staff.find(p=>p.code&&(normTxt(p.code).startsWith(s)||s.startsWith(normTxt(p.code))))||null;

function parseCSV(text){
  const first=(text.split(/\r?\n/)[0]||'');
  const delim=(first.split('\t').length>first.split(',').length)?'\t':',';
  const rows=[];let row=[],f='',q=false;
  for(let i=0;i<text.length;i++){
    const c=text[i];
    if(q){ if(c==='"'){ if(text[i+1]==='"'){f+='"';i++} else q=false } else f+=c; continue }
    if(c==='"'&&f===''){q=true;continue}
    if(c===delim){row.push(f);f='';continue}
    if(c==='\n'||c==='\r'){ if(c==='\r'&&text[i+1]==='\n')i++; row.push(f);f=''; if(row.some(x=>x.trim()!==''))rows.push(row); row=[]; continue }
    f+=c;
  }
  row.push(f); if(row.some(x=>x.trim()!==''))rows.push(row);
  return rows;
}

/* ================= scoring (pure) ================= */
function computeBoard(staff,leads,audits,settings){
  const W=Object.assign({},settings.weights); if(W.confirmations==null&&W.conversions!=null)W.confirmations=W.conversions;
  const minLeads=Math.max(1,+settings.minLeads||1), target=+settings.target||0;
  const by={};
  for(const p of staff)by[p.id]={p,n:0,c:0,lang:{},src:{},ch:{},st:{},auditList:[]};
  for(const l of leads){const b=by[l.s]; if(!b)continue; b.n++; if(l.st==='Confirmed')b.c++; b.lang[l.lang]=(b.lang[l.lang]||0)+1; b.src[l.src]=(b.src[l.src]||0)+1; b.ch[l.ch]=(b.ch[l.ch]||0)+1; b.st[l.st]=(b.st[l.st]||0)+1}
  for(const a of audits){if(by[a.staffId])by[a.staffId].auditList.push(a)}
  const rows=Object.values(by).filter(b=>b.p.active!==false||b.n>0||b.auditList.length);
  const anyLeads=rows.some(b=>b.n>0);
  for(const b of rows){
    b.rate=b.n?b.c/b.n:0;
    b.adjRate=b.rate*Math.min(1,b.n/minLeads);
    b.audit=b.auditList.length?b.auditList.reduce((s,a)=>s+(+a.pct||0),0)/b.auditList.length:null;
  }
  const maxC=Math.max(0,...rows.map(b=>b.c)), maxN=Math.max(0,...rows.map(b=>b.n)), maxAdj=Math.max(0,...rows.map(b=>b.adjRate));
  for(const b of rows){
    const parts=[];
    if(b.audit!=null)parts.push(['audit',b.audit]);
    if(anyLeads){
      parts.push(['confirmations',target>0?Math.min(1,b.c/target)*100:(maxC?b.c/maxC*100:0)]);
      parts.push(['closing',maxAdj?b.adjRate/maxAdj*100:0]);
      parts.push(['volume',maxN?b.n/maxN*100:0]);
    }
    let ws=0,sum=0; for(const [k,v] of parts){const w=+W[k]||0; ws+=w; sum+=w*v}
    b.parts=Object.fromEntries(parts);
    b.score=ws?sum/ws:null;
    b.provisional=b.audit==null;
    b.grade=gradeOf(b.score);
  }
  rows.sort((a,b)=>(b.score??-1)-(a.score??-1)||b.c-a.c||b.n-a.n);
  rows.forEach((b,i)=>b.rank=b.score==null?null:i+1);
  return rows;
}
function gradeOf(s){if(s==null)return {t:'No data',c:'mute'}; if(s>=85)return {t:'Star',c:'star'}; if(s>=70)return {t:'Strong',c:'good'}; if(s>=55)return {t:'Average',c:'warn'}; return {t:'Needs coaching',c:'bad'}}
function pickCount(remaining,cycle){const left=Math.max(1,4-cycle);return Math.min(remaining,Math.ceil(remaining/left))}
function shuffle(arr){const a=arr.slice();for(let i=a.length-1;i>0;i--){const r=new Uint32Array(1);crypto.getRandomValues(r);const j=r[0]%(i+1);[a[i],a[j]]=[a[j],a[i]]}return a}

/* Sample data generator: used for the offline preview, and once by Claude to seed the saved sample. */
function makeSample(staff,month,opts){
  let seed=hashN(month+(opts.salt||''),2147483647)+7;
  const rnd=()=>{seed=(seed*1664525+1013904223)>>>0;return seed/4294967296};
  const wpick=list=>{const t=list.reduce((s,x)=>s+x[1],0);let r=rnd()*t;for(const [k,w] of list){if((r-=w)<0)return k}return list[0][0]};
  const plats=[['Meta Ads',38],['Snapchat Ads',16],['Google Ads',14],['TikTok Ads',7],['LinkedIn Ads',2],['X Ads',2],['Website',7],['Referral',6],['Iqbal Sir (MD)',4],['Dr Shabeer',3],['Walk-in',1]];
  const chFor=p=>/Ads$/.test(p)?wpick([['WhatsApp',62],['Lead form',30],['Phone call',6],['DM',2]]):p==='Website'?wpick([['Website form',60],['WhatsApp',30],['Phone call',10]]):p==='Walk-in'?'In person':wpick([['Phone call',50],['WhatsApp',50]]);
  const langs=[['Arabic',55],['Malayalam',34],['English',8],['Hindi',3]];
  const tr=[['Pediatric rehab',40],['Spine care',15],['Pain management',15],['Physiotherapy',12],['Neuro rehab',13],['Other',5]];
  const NM={Arabic:[['Abdullah','Faisal','Noura','Mohammed','Sara','Khalid','Reem','Turki','Hessa','Omar','Lama','Saud','Fahad','Maha','Yousef','Abeer','Nasser','Hind'],['Al-Qahtani','Al-Otaibi','Al-Harbi','Al-Shehri','Al-Dosari','Al-Mutairi','Al-Ghamdi','Al-Zahrani']],
    Malayalam:[['Anjali','Rahul','Fathima','Muhammed','Sreeja','Arjun','Shahana','Nimisha','Ajmal','Lakshmi','Haris','Divya','Sinan','Ameena'],['K','P','M','T','V','C']],
    English:[['John','Priya','Rizwan','Maria','Daniel','Aisha'],['Thomas','Fernandes','Khan','Joseph']],Hindi:[['Rohit','Pooja','Amit','Neha'],['Sharma','Verma','Gupta']]};
  const active=staff.filter(p=>p.active!==false);
  const skill={}; for(const p of active)skill[p.id]=.08+(hashN(p.id,100)/100)*.32;
  const leads=[];
  for(let i=0;i<opts.leads;i++){
    const lang=wpick(langs);
    const pool=active.filter(p=>langsOf(p).includes(lang)); const p=(pool.length?pool:active)[Math.floor(rnd()*(pool.length||active.length))];
    const d=1+Math.floor(rnd()*opts.days); const age=opts.days-d;
    const src=wpick(plats); const boost=/Iqbal|Shabeer|Referral/.test(src)?1.8:1;
    const r=rnd(); const pc=Math.min(.75,skill[p.id]*boost*(age<3?.4:1));
    const st=r<pc?'Confirmed':r<pc+.22?'Follow-up':r<pc+.44?'Contacted':age<4&&r<pc+.7?'New':r<pc+.62?'Lost':'Contacted';
    const nm=NM[lang]||NM.English;
    leads.push({r:'x'+uid(),d:`${month}-${pad(d)}`,s:p.id,src,ch:chFor(src),lang,st,nm:nm[0][Math.floor(rnd()*nm[0].length)]+' '+nm[1][Math.floor(rnd()*nm[1].length)],ph:'',tr:wpick(tr)});
  }
  const cycles={c1:[],c2:[],c3:[]}, audits=[];
  let pool=active.slice().sort(()=>rnd()-.5);
  for(let c=1;c<=opts.cycles;c++){
    const n=pickCount(pool.length,c); const ids=pool.slice(0,n).map(p=>p.id); pool=pool.slice(n); cycles['c'+c]=ids;
    ids.forEach((id,ix)=>{
      if(c===opts.cycles&&ix>=ids.length-(opts.pending||0))return;
      const base=1.6+skill[id]*7; const sc={}; let t=0;
      for(const k of CRITERIA){sc[k.k]=Math.max(1,Math.min(5,Math.round(base+rnd()*1.6-.5)));t+=sc[k.k]}
      const day=Math.min((c-1)*10+3+Math.floor(rnd()*6),daysIn(month));
      audits.push({month,cycle:c,staffId:id,scores:sc,pct:t/30*100,chats:6+Math.floor(rnd()*14),evaluator:opts.reviewer||'Gokul Sir',date:`${month}-${pad(day)}`,notes:t>=24?'Quick replies and clear package details. Keep it up.':t>=18?'Good tone. Follow up sooner on leads that go quiet.':'Several chats left unanswered. Ask for reports and push for confirmation.',sample:true});
    });
  }
  return {leads,cycles,audits};
}

/* ================= storage adapter ================= */
const Store={
  db:null, mode:'loading', backend:'none',
  async init(){
    if(Auth.on){ this.db=firebase.firestore(); this.mode='db'; this.backend='firebase'; return }
    let c=window.claude;
    for(let i=0;i<20&&!(c&&c.use);i++){await new Promise(r=>setTimeout(r,100));c=window.claude}
    if(!(c&&c.use)){this.mode='memory';return}
    try{ this.db=await Promise.race([c.use('db'),new Promise(r=>setTimeout(()=>r(null),10000))]) }catch(e){this.db=null}
    this.mode=this.db?'db':'memory'; if(this.db)this.backend='claude';
  },
  norm(d){
    if(d==null)return null;
    let data=typeof d.data==='function'?d.data():(d.data!==undefined&&d.data!==null&&typeof d.data==='object'?d.data:d);
    if(data==null)return null;
    const id=d.id||(d.ref&&d.ref.id)||data.id||(d.path?String(d.path).split('/').pop():undefined);
    return Object.assign({},data,{id});
  },
  normList(r){
    let arr=r;
    if(arr&&!Array.isArray(arr)){
      if(Array.isArray(arr.docs))arr=arr.docs; else if(Array.isArray(arr.items))arr=arr.items; else if(Array.isArray(arr.results))arr=arr.results; else if(Array.isArray(arr.documents))arr=arr.documents;
      else if(typeof arr.forEach==='function'){const t=[];arr.forEach(x=>t.push(x));arr=t} else arr=[];
    }
    return (arr||[]).map(d=>this.norm(d)).filter(Boolean);
  },
  async run(q){
    if(typeof q.get==='function')return await q.get();
    if(typeof q.onSnapshot==='function')return await new Promise((res,rej)=>{let un;un=q.onSnapshot(s=>{res(s);try{typeof un==='function'&&setTimeout(un,0)}catch(e){}},rej)});
    throw new Error('query not supported');
  },
  async list(col,field,val){
    if(!this.db)return [];
    if(field){
      try{return this.normList(await this.run(this.db.collection(col).where(field,'==',val)))}catch(e){console.warn('where failed, filtering locally',e)}
      return this.normList(await this.run(this.db.collection(col))).filter(d=>d[field]===val);
    }
    return this.normList(await this.run(this.db.collection(col)));
  },
  async get(col,id){
    if(!this.db)return null;
    const r=await this.db.collection(col).doc(id).get();
    if(r&&r.exists===false)return null;
    if(r&&typeof r.exists==='function'&&!r.exists())return null;
    return this.norm(r);
  },
  async put(col,id,data){ if(!this.db)return; const clean=JSON.parse(JSON.stringify(data)); delete clean.id; await this.db.collection(col).doc(id).set(clean) },
  async del(col,id){ if(!this.db)return; await this.db.collection(col).doc(id).delete() }
};

  for(const k of ['minLeads','target','confirmWords','currency'])if(cfg[k]!==undefined)s[k]=cfg[k];
  for(const k of ['languages','channels','reviewers','regions','creatives'])if(Array.isArray(cfg[k])&&cfg[k].length)s[k]=cfg[k];
  if(Array.isArray(cfg.platforms)&&cfg.platforms.length)s.platforms=cfg.platforms.map(p=>typeof p==='string'?{n:p,g:'Other'}:p);
  return s;
}
async function loadMonth(){
  if(Store.mode==='db'){
    const [chunks,camps]=await Promise.all([Store.list('leads'),Store.list('campaigns').catch(()=>[])]);
    S.chunks=chunks; S.campaigns=camps.map(normCamp); S.auditsAll={};
  }else memInit();
  await loadAudits();
}
async function loadAudits(){
  const r=curRange(); const months=new Set(monthsBetween(r.from,r.to)); months.add(S.month);
  if(Store.mode==='db'){
    const need=[...months].filter(m=>!S.auditsAll[m]);
    const res=await Promise.all(need.map(m=>Store.list('audits','month',m)));
    need.forEach((m,i)=>S.auditsAll[m]=res[i]);
    const cyc=await Store.get('cycles',S.month).catch(()=>null);
    S.cycles={c1:(cyc&&cyc.c1)||[],c2:(cyc&&cyc.c2)||[],c3:(cyc&&cyc.c3)||[]};
  }else{
    for(const m of months)S.auditsAll[m]=S.auditsAll[m]||[];
    S.cycles=S.memCycles[S.month]||(S.memCycles[S.month]={c1:[],c2:[],c3:[]});
  }
  S.audits=S.auditsAll[S.month]||(S.auditsAll[S.month]=[]);
}
function memInit(){
  if(S._memInit)return; S._memInit=true;
  const cur=monthOf(todayStr());
  for(const m of [shiftMonth(cur,-2),shiftMonth(cur,-1),cur]){
    const isCur=m===cur; const smp=makeSample(S.staff,m,{leads:isCur?90:120,days:isCur?+todayStr().slice(8):daysIn(m),cycles:isCur?Math.max(1,currentCycle(m)-1):3,pending:isCur?2:0,salt:m});
    S.chunks.push({id:m+'_sample',month:m,kind:'sample',sample:true,rows:smp.leads});
    S.auditsAll[m]=smp.audits.map(a=>Object.assign({id:m+'_'+a.staffId},a)); S.memCycles[m]=smp.cycles;
  }
  S.campaigns=makeCampaigns();
}
async function save(col,id,data){

}

function countUp(){
  if(matchMedia('(prefers-reduced-motion: reduce)').matches)return;
  document.querySelectorAll('[data-cu]').forEach(el=>{
    const to=parseFloat(el.dataset.cu), dec=+el.dataset.dec||0, suf=el.dataset.suf||''; if(!isFinite(to)||to===0)return;
    const t0=performance.now(), dur=800;
    const step=t=>{const k=Math.min(1,(t-t0)/dur), e=1-Math.pow(1-k,3); el.textContent=(to*e).toFixed(dec)+suf; if(k<1)requestAnimationFrame(step)};
    requestAnimationFrame(step);
  });
}
function cu(v,dec=0,suf=''){return `<span data-cu="${v}" data-dec="${dec}" data-suf="${suf}">${(+v).toFixed(dec)}${suf}</span>`}
function pendingAudits(){const done=new Set(S.audits.map(a=>a.staffId));return [...S.cycles.c1,...S.cycles.c2,...S.cycles.c3].filter(id=>!done.has(id)&&staffById(id)).length}
function monthSw(){return `<div class="monthsw" aria-label="Month"><button data-act="mPrev" aria-label="Previous month">${IC.left}</button><span class="num">${monthLabel(S.month)}</span><button data-act="mNext" aria-label="Next month">${IC.right}</button></div>`}
function periodSw(){const P=S.period;
  return `<div class="period"><select id="periodSel" aria-label="Period">${[['month','Single month'],['last3','Last 3 months'],['last6','Last 6 months'],['year','This year'],['all','All time'],['custom','Custom range']].map(([v,t])=>`<option value="${v}" ${P.mode===v?'selected':''}>${t}</option>`).join('')}</select>${P.mode==='month'?monthSw():P.mode==='custom'?`<div class="range"><input type="date" id="pFrom" value="${esc(P.from||'')}" aria-label="From"><span>to</span><input type="date" id="pTo" value="${esc(P.to||'')}" aria-label="To"><button class="btn sm primary" data-act="pApply">Apply</button></div>`:`<span class="plabel num">${esc(rangeText())}</span>`}</div>`}
function header(title,sub,actions='',sw='period'){return `<div class="ph"><div><h1>${title}</h1>${sub?`<p>${sub}</p>`:''}</div><div class="ph-r">${actions}${sw==='period'?periodSw():sw==='month'?monthSw():''}</div></div><!--banner-->`}

function stackBar(segs,max){const tot=segs.reduce((s,x)=>s+x[1],0);return `<div class="track"><div class="stack" style="width:${max?tot/max*100:0}%">${segs.filter(x=>x[1]).map(([c,v,t])=>`<i style="width:${tot?v/tot*100:0}%;background:${c}" title="${esc(t||'')}: ${v}"></i>`).join('')}</div></div>`}
function bars(items,total,colorFn){
  if(!items.length)return '<p class="note">No leads yet for this month.</p>';
  const max=Math.max(...items.map(i=>i[1]),1);
  return `<div class="bars">${items.map(([k,v])=>`<div class="brow"><span class="bn" title="${esc(k)}">${esc(k)}</span>${stackBar([[colorFn?colorFn(k):'var(--teal)',v,k]],max)}<span class="bv num">${v}${total?`<small>${fmtPct(pct(v,total))}</small>`:''}</span></div>`).join('')}</div>`;
}

/* ---------- marketing ---------- */
const ALL_TR='All treatments', ALL_LANG='All languages', MIXED='Mixed';
function fmtMoney(v,compact){

    if(compact&&v>=1e7)return '₹'+(v/1e7).toFixed(2)+' Cr';
    if(compact&&v>=1e5)return '₹'+(v/1e5).toFixed(2)+' L';

function dayNum(d){return Math.round(Date.parse(String(d).slice(0,10)+'T00:00:00Z')/86400000)}
function monthEndStr(m){return `${m}-${pad(daysIn(m))}`}
function overlapDays(a1,a2,b1,b2){const a=Math.max(dayNum(a1),dayNum(b1)),b=Math.min(dayNum(a2),dayNum(b2));return b<a?0:b-a+1}

/* Older campaigns stored one spend figure for a date range: turn that into monthly figures. */
function normCamp(c){
  if(!c.monthly||typeof c.monthly!=='object'){
    c.monthly={};
    if(c.start){const s=c.start,e=c.end||c.start,tot=overlapDays(s,e,s,e)||1;
      for(const m of monthsBetween(s,e)){const k=overlapDays(s,e,m+'-01',monthEndStr(m))/tot;c.monthly[m]={spend:Math.round((+c.spend||0)*k),leads:c.repLeads==null||c.repLeads===''?null:Math.round((+c.repLeads||0)*k)}}}

}
/* Days the campaign was live in month m (start date to stop date, or today while running). */
function activeSpan(c,m){const s=c.start>m+'-01'?c.start:m+'-01';const cap=c.end||todayStr();const me=monthEndStr(m);const e=cap<me?cap:me;return e<s?null:[s,e]}
function campInRange(c,from,to){

function campaignsInRange(){const r=curRange();return S.campaigns.filter(c=>c.start&&c.start<=r.to&&campEnd(c)>=r.from)}
function matchCampaign(raw,src){const s=normTxt(raw);if(!s)return null;const pool=src?S.campaigns.filter(c=>c.src===src):S.campaigns;return pool.find(c=>normTxt(c.name)===s)||(src?null:S.campaigns.find(c=>normTxt(c.name).includes(s)||s.includes(normTxt(c.name))))||null}
/* Leads and spend come from the monthly figures you enter. Confirmations come from the leads in this app:

function campStats(){
  const r=curRange(), camps=campaignsInRange(), st={};
  for(const c of camps){const x=campInRange(c,r.from,r.to);st[c.id]={c,spend:x.spend,rep:x.leads,hasRep:x.hasLeads,app:0,conf:0,tagged:0}}
  let unmatched=0;
  for(const l of leadsOfMonth()){
    if(l.camp&&st[l.camp]){const x=st[l.camp];x.app++;x.tagged++;if(l.st==='Confirmed')x.conf++;continue}
    const act=camps.filter(c=>c.src===l.src&&l.d>=c.start&&l.d<=campEnd(c));
    if(!act.length){if(groupOf(l.src)==='Paid ads')unmatched++;continue}
    const strict=act.filter(c=>(!c.tr||c.tr===ALL_TR||c.tr===l.tr)&&(!c.lang||c.lang===ALL_LANG||c.lang===l.lang)&&(!c.ch||c.ch===MIXED||c.ch===l.ch));
    const cands=strict.length?strict:act; const wt=c=>Math.max(1,+((c.monthly||{})[monthOf(l.d)]||{}).spend||0); const tot=cands.reduce((a,c)=>a+wt(c),0);
    for(const c of cands){const w=wt(c)/tot;st[c.id].app+=w;if(l.st==='Confirmed')st[c.id].conf+=w}

const MK_DIMS={src:{t:'Platform',v:c=>c.src},ch:{t:'Channel',v:c=>c.ch||MIXED},tr:{t:'Treatment',v:c=>c.tr||ALL_TR},lang:{t:'Language',v:c=>c.lang||ALL_LANG},region:{t:'Market',v:c=>c.region||'—'},creative:{t:'Creative',v:c=>c.creatives&&c.creatives.length?c.creatives:['—']}};

function cimpBuild(){

  const M=CIMP.map, df=$('#cimpDay').value==='1', m=$('#cimpMonth').value, out=[];
  const num=v=>{const n=parseFloat(String(v||'').replace(/[^0-9.\-]/g,''));return isFinite(n)?n:null};
  const pick=(v,list,all)=>{const s=normTxt(v);if(!s)return all;return list.find(x=>normTxt(x)===s)||list.find(x=>s.includes(normTxt(x))||normTxt(x).includes(s))||all};
  const agg={};
  for(const row of CIMP.rows.slice(1)){
    const g=k=>M[k]===undefined?'':(row[M[k]]||'').trim();
    const name=g('name'); if(!name)continue;
    const src=g('src')?normPlatform(g('src'),S.settings.platforms):$('#cimpSrc').value;

    a.spend+=num(g('spend'))||0; const l=num(g('rep')); if(l!=null)a.leads=(a.leads||0)+l;
    const sd=parseDate(g('start'),df); if(sd&&(!a.start||sd<a.start))a.start=sd;
  }
  for(const a of Object.values(agg)){const ex=matchCampaign(a.name,a.src);out.push(Object.assign(a,{month:m,ex:ex?ex.id:null}))}
  return out;
}

function makeCampaigns(){
  const T=[
    ['Pediatric Rehab Package · GCC · Arabic video','Meta Ads','WhatsApp','Pediatric rehab','Arabic','GCC (all)',['Video','Testimonial video'],160000],
    ['Autism & Speech Delay · Saudi · Lead form','Meta Ads','Lead form','Pediatric rehab','Arabic','Saudi Arabia',['Testimonial video'],85000],
    ['Spine & Back Pain · Kerala · Malayalam','Meta Ads','WhatsApp','Spine care','Malayalam','Kerala',['Doctor video','Image'],48000],
    ['Pain Management · India','Meta Ads','Mixed','Pain management','All languages','India',['Image','Carousel'],30000],
    ['Physio Package · North India · Hindi','Meta Ads','WhatsApp','Physiotherapy','Hindi','India',['Video'],20000],
    ['Doctor Introduction Video · GCC','Snapchat Ads','Mixed','All treatments','Arabic','GCC (all)',['Doctor video'],80000],
    ['Pediatric Rehab · Saudi · Snap form','Snapchat Ads','Lead form','Pediatric rehab','Arabic','Saudi Arabia',['Video'],40000],
    ['Search · Rehabilitation hospital Kerala','Google Ads','Mixed','All treatments','All languages','India',['Search ad'],70000],
    ['Search · Neuro rehab India for GCC','Google Ads','Mixed','Neuro rehab','Arabic','GCC (all)',['Search ad'],35000],
    ['Patient Journey Video · GCC','TikTok Ads','Mixed','All treatments','All languages','GCC (all)',['Video','Testimonial video'],42000],
    ['Corporate Physio · UAE','LinkedIn Ads','Lead form','Physiotherapy','English','UAE',['Image'],16000],
    ['Neuro Rehab Awareness · Saudi','X Ads','Mixed','Neuro rehab','Arabic','Saudi Arabia',['Image'],11000]];
  const t=todayStr(), cur=monthOf(t), months=[shiftMonth(cur,-2),shiftMonth(cur,-1),cur];
  return T.map((x,i)=>{
    let seed=hashN(x[0],99991)+3; const rnd=()=>{seed=(seed*1664525+1013904223)>>>0;return seed/4294967296};
    const end=i===11?`${months[1]}-${pad(daysIn(months[1]))}`:null; const monthly={};
    for(const m of months){if(end&&m>monthOf(end))continue;const frac=m===cur?(+t.slice(8))/daysIn(m):1;const spend=Math.round(x[7]*(0.8+rnd()*0.4)*frac/100)*100;monthly[m]={spend,leads:Math.round(spend/(1300+rnd()*1700))}}
    return {id:'c_s'+(i+1),name:x[0],src:x[1],ch:x[2],tr:x[3],lang:x[4],region:x[5],creatives:x[6],start:months[0]+'-01',end,monthly,notes:'',sample:true};
  });
}

let IMP=null;
const FIELDS=[['d','Date',/date|time|day/],['s','Assigned staff',/assign|staff|agent|owner|sales|handled|executive|counsel|gre/],['src','Platform / source',/source|platform|^ads?$|from/],['ch','Channel',/channel|medium|via|type/],['lang','Language',/lang/],['st','Status',/status|stage|result|outcome|confirm|conver|remark/],['nm','Lead name',/^name|patient|lead name|customer|client/],['ph','Phone',/phone|mobile|whats|number|contact/],['tr','Treatment',/treat|service|speciality|department|condition|interest/],['camp','Campaign',/campaign|ad ?set/]];
function importModal(){
  IMP={rows:null,map:{}};
  openModal(`<div class="modal-h"><div><h2>Import leads</h2><p>In Google Sheets, select the rows including the header row, copy, and paste below. Or choose a CSV file. Each lead goes into the month of its date.</p></div>${closeBtn}</div>
  <div class="toolbar"><input type="file" id="impFile" accept=".csv,.tsv,.txt,text/csv"></div>
  <textarea id="impText" placeholder="Date&#9;Name&#9;Phone&#9;Platform&#9;Channel&#9;Language&#9;Assigned to&#9;Status"></textarea>
  <div class="toolbar"><button class="btn primary" data-act="impRead">Read data</button></div>
  <div id="impMap"></div>`);
  $('#impFile').addEventListener('change',e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{$('#impText').value=r.result;impRead()};r.readAsText(f)});
}
function impRead(){
  const rows=parseCSV($('#impText').value||'');
  if(rows.length<2){$('#impMap').innerHTML='<p class="note">Paste at least a header row and one data row.</p>';return}
  IMP.rows=rows; const head=rows[0].map(h=>h.trim());
  const used=new Set(); IMP.map={};
  for(const [k,,re] of FIELDS){const i=head.findIndex((h,ix)=>!used.has(ix)&&re.test(h.toLowerCase()));if(i>=0){IMP.map[k]=i;used.add(i)}}
  const sel=k=>`<select data-map="${k}"><option value="">— not in my sheet —</option>${head.map((h,i)=>`<option value="${i}" ${IMP.map[k]===i?'selected':''}>${esc(h||'Column '+(i+1))}</option>`).join('')}</select>`;
  $('#impMap').innerHTML=`<h3>Match your columns</h3><div class="form" style="margin-top:10px">${FIELDS.map(([k,t])=>`<label class="f">${t}${sel(k)}</label>`).join('')}
    <label class="f">Dates are written<select id="impDayFirst"><option value="1">Day first (11/03 = 11 March)</option><option value="0">Month first (03/11 = 11 March)</option></select></label></div>
    <div id="impPrev" style="margin-top:14px"></div>
    <div class="modal-f" style="margin-top:14px"><button class="btn" data-act="close">Cancel</button><button class="btn primary" data-act="impGo" id="impGo">Import</button></div>`;
  $('#impMap').querySelectorAll('select').forEach(s=>s.addEventListener('change',impPreview));
  impPreview();
}
function impBuild(){
  document.querySelectorAll('[data-map]').forEach(s=>{IMP.map[s.dataset.map]=s.value===''?undefined:+s.value});
  const dayFirst=$('#impDayFirst').value==='1', M=IMP.map, words=S.settings.confirmWords.split(',').map(s=>s.trim().toLowerCase()).filter(Boolean);
  const out=[],unknown={},badDate=[];
  for(const row of IMP.rows.slice(1)){
    const g=k=>M[k]===undefined?'':(row[M[k]]||'').trim();
    const p=matchStaff(g('s'),S.staff);
    if(!p){const k=g('s')||'(blank)';unknown[k]=(unknown[k]||0)+1;continue}
    const d=M.d===undefined?(monthOf(todayStr())===S.month?todayStr():`${S.month}-01`):parseDate(g('d'),dayFirst);
    if(!d){badDate.push(g('d'));continue}
    const srcRaw=g('src');
    out.push({r:uid(),d,s:p.id,src:normPlatform(srcRaw,S.settings.platforms),ch:normChannel(g('ch')||srcRaw,S.settings.channels,S.settings.channels[0]),lang:normLang(g('lang'),S.settings.languages)||langsOf(p)[0],st:normStatus(g('st'),words),nm:g('nm'),ph:g('ph'),tr:g('tr')});
    const cm=matchCampaign(g('camp'));if(cm)out[out.length-1].camp=cm.id;
  }
  return {out,unknown,badDate};
}
function impPreview(){
  const {out,unknown,badDate}=impBuild(); IMP.out=out;
  const months={};for(const l of out)months[monthOf(l.d)]=(months[monthOf(l.d)]||0)+1;
  const unk=Object.entries(unknown);
  $('#impPrev').innerHTML=`<div class="kv"><div><span>Ready</span><b class="num">${out.length}</b></div><div><span>Confirmed</span><b class="num">${out.filter(l=>l.st==='Confirmed').length}</b></div><div><span>Staff not found</span><b class="num">${unk.reduce((s,x)=>s+x[1],0)}</b></div><div><span>Bad dates</span><b class="num">${badDate.length}</b></div></div>
  <p class="note" style="margin-top:8px">Months: ${Object.entries(months).map(([m,n])=>monthLabel(m)+' '+n).join(' · ')||'—'}</p>
  ${unk.length?`<p class="note"><b>These names didn't match anyone and will be skipped:</b> ${unk.slice(0,12).map(([k,n])=>esc(k)+' ('+n+')').join(', ')}${unk.length>12?'…':''}. Add them under Sales team, or fix "Name in lead sheet", then import again.</p>`:''}
  ${out.length?`<div class="tbl-wrap" style="margin-top:10px"><table><thead><tr><th>Date</th><th>Staff</th><th>Platform</th><th>Channel</th><th>Language</th><th>Status</th><th>Lead</th></tr></thead><tbody>${out.slice(0,5).map(l=>`<tr><td>${fmtDate(l.d)}</td><td>${esc(staffById(l.s).name)}</td><td>${esc(l.src)}</td><td>${esc(l.ch)}</td><td>${esc(l.lang)}</td><td>${l.st}</td><td>${esc(l.nm)}</td></tr>`).join('')}</tbody></table></div>`:''}`;
  const b=$('#impGo'); if(b){b.disabled=!out.length;b.textContent=`Import ${out.length} leads`}
}
async function impGo(){
  const out=IMP.out||[]; if(!out.length)return;
  const btn=$('#impGo'); btn.disabled=true; btn.textContent='Importing…';
  const byMonth={}; for(const l of out)(byMonth[monthOf(l.d)]=byMonth[monthOf(l.d)]||[]).push(l);
  let ok=true;
  for(const [m,ls] of Object.entries(byMonth)){
    for(let i=0;i<ls.length;i+=250){
      const id=`${m}_${uid()}`, doc={month:m,kind:'import',rows:ls.slice(i,i+250),at:new Date().toISOString()};
      if(Store.mode==='db'){ok=await save('leads',id,doc)&&ok}
      if(Store.mode!=='db'||ok)S.chunks.push(Object.assign({id},doc));
    }
  }
  closeModal(); toast(ok?`Imported ${out.length} leads`:'Some leads could not be saved');
  render();
}
